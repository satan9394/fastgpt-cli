# FastGPT 本地部署（裁剪版，用于 Phase 3 真实三连验证）
# 基于官方 CN docker-compose.pg.yml（PG 向量版）裁剪：
#   - 保留: fastgpt-vector(pg) / mongo / redis / minio / app / code-sandbox / plugin
#   - 裁掉: mcp-server / opensandbox / volume-manager / agent-sandbox-proxy / aiproxy(+pg) / prepull
# 端口: app=3100（3000 已被 new-api 占用）, minio=9000/9001（无冲突）

x-default-root-psw: &x-default-root-psw '${FASTGPT_ROOT_PSW:-1234}'
x-fe-domain: &x-fe-domain 'http://localhost:3100'
x-system-key: &x-system-key '${FASTGPT_SYSTEM_KEY:-change-me-in-production}'
x-plugin-auth-token: &x-plugin-auth-token '${FASTGPT_PLUGIN_TOKEN:-change-me-in-production}'
x-code-sandbox-token: &x-code-sandbox-token '${FASTGPT_SANDBOX_TOKEN:-change-me-in-production}'

x-share-db-config: &x-share-db-config
  MONGODB_URI: mongodb://${MONGO_USER:-fastgpt}:${MONGO_PASSWORD:-change-me}@fastgpt-mongo:27017/fastgpt?authSource=admin
  DB_MAX_LINK: 100
  REDIS_URL: redis://default:${REDIS_PASSWORD:-change-me}@fastgpt-redis:6379
  STORAGE_VENDOR: minio
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
  STORAGE_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  STORAGE_PUBLIC_BUCKET: fastgpt-public
  STORAGE_PRIVATE_BUCKET: fastgpt-private
  STORAGE_DOWNLOAD_URL_MODE: short-proxy
  STORAGE_S3_ENDPOINT: http://fastgpt-minio:9000
  STORAGE_S3_FORCE_PATH_STYLE: true
  STORAGE_S3_MAX_RETRIES: 3

x-log-config: &x-log-config
  LOG_ENABLE_CONSOLE: true
  LOG_CONSOLE_LEVEL: info
  LOG_ENABLE_OTEL: false
  LOG_OTEL_LEVEL: info
  LOG_OTEL_URL: http://localhost:4318/v1/logs

x-no-proxy-config: &x-no-proxy-config
  NO_PROXY: localhost,127.0.0.1,::1,fastgpt-app,fastgpt-plugin,fastgpt-code-sandbox,fastgpt-minio,fastgpt-mongo,fastgpt-redis,fastgpt-vector,host.docker.internal,.jina.ai,.openai.com,.deepseek.com
  no_proxy: localhost,127.0.0.1,::1,fastgpt-app,fastgpt-plugin,fastgpt-code-sandbox,fastgpt-minio,fastgpt-mongo,fastgpt-redis,fastgpt-vector,host.docker.internal,.jina.ai,.openai.com,.deepseek.com
  HTTP_PROXY: http://host.docker.internal:7897
  HTTPS_PROXY: http://host.docker.internal:7897
  http_proxy: http://host.docker.internal:7897
  https_proxy: http://host.docker.internal:7897

x-vec-config: &x-vec-config
  PG_URL: postgresql://${PG_USER:-fastgpt}:${PG_PASSWORD:-change-me}@fastgpt-vector:5432/postgres

services:
  fastgpt-vector:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15
    container_name: fastgpt-pg
    restart: always
    networks:
      - data
    environment:
      - POSTGRES_USER=${PG_USER:-fastgpt}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-change-me}
      - POSTGRES_DB=postgres
    volumes:
      - fastgpt-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'username', '-d', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  fastgpt-mongo:
    image: mongo:5.0.32
    container_name: fastgpt-mongo
    restart: always
    networks:
      - data
    command: mongod --keyFile /data/mongodb.key --replSet rs0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-fastgpt}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-change-me}
    volumes:
      - fastgpt-mongo:/data/db
    healthcheck:
      test: ['CMD', 'mongo', '-u', '${MONGO_USER:-fastgpt}', '-p', '${MONGO_PASSWORD:-change-me}', '--authenticationDatabase', 'admin', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 128 > /data/mongodb.key
        chmod 400 /data/mongodb.key
        chown 999:999 /data/mongodb.key
        echo 'const isInited = rs.status().ok === 1
        if(!isInited){
          rs.initiate({
              _id: "rs0",
              members: [
                  { _id: 0, host: "fastgpt-mongo:27017" }
              ]
          })
        }' > /data/initReplicaSet.js
        exec docker-entrypoint.sh "$$@" &
        until mongo -u ${MONGO_USER:-fastgpt} -p ${MONGO_PASSWORD:-change-me} --authenticationDatabase admin --eval "print('waited for connection')"; do
          echo "Waiting for MongoDB to start..."
          sleep 2
        done
        mongo -u ${MONGO_USER:-fastgpt} -p ${MONGO_PASSWORD:-change-me} --authenticationDatabase admin /data/initReplicaSet.js
        wait $$!

  fastgpt-redis:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/redis:7.2-alpine
    container_name: fastgpt-redis
    networks:
      - data
    restart: always
    command: |
      redis-server --requirepass ${REDIS_PASSWORD:-change-me} --loglevel warning --maxclients 10000 --appendonly yes --save 60 10 --maxmemory 4gb --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-change-me}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    volumes:
      - fastgpt-redis:/data

  fastgpt-minio:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fastgpt-minio
    restart: always
    networks:
      - data
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - fastgpt-minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-app:
    container_name: fastgpt-app
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt:v4.16.0
    ports:
      - 3100:3000
    networks:
      - data
      - app
      - codesandbox
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-vector:
        condition: service_healthy
      fastgpt-redis:
        condition: service_healthy
      fastgpt-minio:
        condition: service_healthy
      fastgpt-code-sandbox:
        condition: service_healthy
      fastgpt-plugin:
        condition: service_healthy
    restart: always
    environment:
      <<: [*x-share-db-config, *x-vec-config, *x-log-config, *x-no-proxy-config]
      HOSTNAME: 0.0.0.0
      FE_DOMAIN: *x-fe-domain
      ROOT_KEY: *x-system-key
      DEFAULT_ROOT_PSW: *x-default-root-psw
      DB_MAX_LINK: 5
      SYNC_INDEX: true
      SYSTEM_MAX_STRING_LENGTH_M: 100
      FILE_TOKEN_KEY: ${FILE_TOKEN_KEY:-change-me-in-production}
      AES256_SECRET_KEY: ${AES256_SECRET_KEY:-change-me-in-production}
      INVOKE_TOKEN_SECRET: ${INVOKE_TOKEN_SECRET:-change-me-in-production}
      MULTIPLE_DATA_TO_BASE64: false
      PLUGIN_BASE_URL: http://fastgpt-plugin:3000
      PLUGIN_TOKEN: *x-plugin-auth-token
      CODE_SANDBOX_URL: http://fastgpt-code-sandbox:3000
      CODE_SANDBOX_TOKEN: *x-code-sandbox-token
      LOG_OTEL_SERVICE_NAME: fastgpt-client
      DATASET_PARSE_MAX_PROCESS: 10
      VECTOR_MAX_PROCESS: 10
      QA_MAX_PROCESS: 10
      VLM_MAX_PROCESS: 10
      HNSW_EF_SEARCH: 100
      HNSW_MAX_SCAN_TUPLES: 100000
      CHAT_API_KEY: ${NEW_API_KEY:-sk-your-new-api-key-here}
      CHAT_BASE_URL: http://host.docker.internal:3000/v1

  fastgpt-code-sandbox:
    container_name: fastgpt-code-sandbox
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.16.0
    networks:
      - codesandbox
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      <<: [*x-log-config, *x-no-proxy-config]
      LOG_OTEL_SERVICE_NAME: fastgpt-code-sandbox
      SANDBOX_TOKEN: *x-code-sandbox-token
      SANDBOX_API_MAX_BODY_MB: 8
      SANDBOX_MAX_TIMEOUT: 60000
      SANDBOX_MAX_MEMORY_MB: 256
      SANDBOX_MAX_OUTPUT_MB: 10
      SANDBOX_POOL_SIZE: 20
      CHECK_INTERNAL_IP: true
      SANDBOX_REQUEST_MAX_COUNT: 30
      SANDBOX_REQUEST_TIMEOUT: 60000
      SANDBOX_REQUEST_MAX_RESPONSE_MB: 10
      SANDBOX_REQUEST_MAX_BODY_MB: 5
      SANDBOX_JS_ALLOWED_MODULES: lodash,dayjs,moment,uuid,crypto-js,qs,url,querystring
      SANDBOX_PYTHON_ALLOWED_MODULES: math,cmath,decimal,fractions,random,statistics,collections,array,heapq,bisect,queue,copy,itertools,functools,operator,string,re,difflib,textwrap,unicodedata,codecs,datetime,time,calendar,_strptime,json,csv,base64,binascii,struct,hashlib,hmac,secrets,uuid,typing,abc,enum,dataclasses,contextlib,pprint,weakref,numpy,pandas,matplotlib
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then((res) => { if (!res.ok) throw new Error(String(res.status)); })"]
      interval: 30s
      timeout: 20s
      retries: 3

  fastgpt-plugin:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v1.1.0
    container_name: fastgpt-plugin
    restart: always
    networks:
      - data
      - app
    environment:
      <<: [*x-share-db-config, *x-log-config, *x-no-proxy-config]
      AUTH_TOKEN: *x-plugin-auth-token
      SERVICE_REQUEST_MAX_CONTENT_LENGTH: 10
      MAX_API_SIZE: 10
      LOG_OTEL_SERVICE_NAME: fastgpt-plugin
    depends_on:
      fastgpt-mongo:
        condition: service_healthy
      fastgpt-minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  data:
    name: fastgpt_data
  app:
    name: fastgpt_app
  codesandbox:
    name: fastgpt_codesandbox

volumes:
  fastgpt-pg:
  fastgpt-mongo:
  fastgpt-redis:
  fastgpt-minio:
